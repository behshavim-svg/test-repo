name: Telegram Multi-Channel Scraper

on:
  schedule:
    - cron: '*/15 * * * *' # حالا که محدودیت زمانی نداریم (چون ریپو پابلیک است)، می‌توانیم هر 15 دقیقه اجرایش کنیم
  workflow_dispatch:

jobs:
  scrape-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. دانلود ریپوی اصلی (کدها) در پوشه engine
      - name: Checkout Engine Repo
        uses: actions/checkout@v4
        with:
          path: 'engine'

      # 2. دانلود ریپوی دوم (دیتا) در پوشه buffer با استفاده از توکن PAT
      - name: Checkout Buffer Repo (Private)
        uses: actions/checkout@v4
        with:
          repository: 'YOUR_GITHUB_USERNAME/YOUR_PRIVATE_REPO_NAME' # نام ریپوی دوم خود را اینجا بنویسید
          token: ${{ secrets.PAT_TOKEN }}
          path: 'buffer'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r engine/requirements.txt

      # 3. اجرای اسکریپت
      - name: Run Scraper
        env:
          CHANNELS_STATE: ${{ vars.CHANNELS_STATE }}
        run: python engine/scraper.py

      # 4. کامیت و پوش فقط در ریپوی Buffer
      - name: Commit and Push to Buffer Repo
        id: commit_step
        run: |
          cd buffer # وارد پوشه دیتای خصوصی می‌شویم
          if [ -f "lock.txt" ]; then
            git config --global user.name "Scraper Bot"
            git config --global user.email "bot@github-actions.local"
            
            git add .
            git commit -m "Auto-scrape: New messages added"
            git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/YOUR_GITHUB_USERNAME/YOUR_PRIVATE_REPO_NAME.git HEAD:main
            
            echo "pushed=true" >> $GITHUB_OUTPUT
          else
            echo "No lock file generated. Skipping commit."
            echo "pushed=false" >> $GITHUB_OUTPUT
          fi

      # 5. آپدیت کردن متغیر وضعیت در ریپوی اول (Engine)
      - name: Update CHANNELS_STATE Variable
        if: steps.commit_step.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/actions/variables/CHANNELS_STATE \
            -f name='CHANNELS_STATE' \
            -f value="$(cat engine/new_state.json)"
