name: Telegram Multi-Channel Scraper

on:
  schedule:
    - cron: '*/15 * * * *' # Run every 15 minutes
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Scraper
        env:
          # Pass the JSON string to the Python script
          CHANNELS_STATE: ${{ vars.CHANNELS_STATE }}
        run: python scraper.py

      - name: Commit and Push Changes
        id: commit_step
        run: |
          # If lock.txt is generated, it means new data was found
          if [ -f "lock.txt" ]; then
            git config --global user.name "Scraper Bot"
            git config --global user.email "bot@github-actions.local"
            git add data/ media/ lock.txt
            git commit -m "Auto-scrape: New messages added"
            
            # Push using PAT to ensure workflow permissions
            git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
            
            echo "pushed=true" >> $GITHUB_OUTPUT
          else
            echo "No lock file generated. Skipping commit."
            echo "pushed=false" >> $GITHUB_OUTPUT
          fi

      - name: Update CHANNELS_STATE Variable
        if: steps.commit_step.outputs.pushed == 'true'
        env:
          # GitHub CLI requires a token to authenticate API requests
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # Use GitHub CLI to securely PATCH the JSON variable
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/actions/variables/CHANNELS_STATE \
            -f name='CHANNELS_STATE' \
            -f value="$(cat new_state.json)"
