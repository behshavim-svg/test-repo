name: Telegram Multi-Channel Scraper

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  scrape-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the public engine repository
      - name: Checkout Engine Repo
        uses: actions/checkout@v4
        with:
          path: 'engine'

      # 2. Checkout the private buffer repository
      - name: Checkout Buffer Repo (Private)
        uses: actions/checkout@v4
        with:
          # 👇 CHANGE THIS 👇
          repository: 'behshavim-svg/test2'
          token: ${{ secrets.PAT_TOKEN }}
          path: 'buffer'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r engine/requirements.txt

      # 3. Securely fetch the CHANNELS_STATE from the Private Repository
      - name: Fetch State from Private Repo
        id: fetch_state
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          STATE=$(gh api /repos/behshavim-svg/test2/actions/variables/CHANNELS_STATE --jq '.value')
          
          # استفاده از فرمت چندخطی استاندارد گیت‌هاب اکشن
          echo "state<<EOF" >> $GITHUB_OUTPUT
          echo "$STATE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 4. Run the Python Scraper
      - name: Run Scraper
        working-directory: ./engine
        env:
          # Pass the securely fetched state to Python
          CHANNELS_STATE: ${{ steps.fetch_state.outputs.state }}
        run: python scraper.py

      # 5. Commit and Push data to the Private Buffer Repository
      - name: Commit and Push to Buffer Repo
        id: commit_step
        run: |
          cd buffer
          if [ -f "lock.txt" ]; then
            git config --global user.name "Scraper Bot"
            git config --global user.email "bot@github-actions.local"
            
            git add .
            git commit -m "Auto-scrape: New messages added"
            
            # 👇 CHANGE THIS 👇
            git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/behshavim-svg/test2.git HEAD:main
            
            echo "pushed=true" >> $GITHUB_OUTPUT
          else
            echo "No lock file generated. Skipping commit."
            echo "pushed=false" >> $GITHUB_OUTPUT
          fi

      # 6. Update the CHANNELS_STATE variable in the Private Repository
      - name: Update CHANNELS_STATE Variable in Private Repo
        if: steps.commit_step.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # 👇 CHANGE THIS 👇
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/behshavim-svg/test2/actions/variables/CHANNELS_STATE \
            -f name='CHANNELS_STATE' \
            -f value="$(cat engine/new_state.json)"
